<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logistics — Phase 1</title>
<style>
  :root{
    --bg:#0b1420;
    --bg-panel:#101d2b;
    --ground:#16301f;
    --grid-line:#1c3346;
    --road:#4a5568;
    --road-edge:#6b7a8d;
    --teal:#2ea6a1;
    --amber:#e0a840;
    --amber-dim:#8a6a2e;
    --danger:#c0524a;
    --text:#d7e2ea;
    --text-dim:#7f95a6;
    --mono: 'Consolas', 'SF Mono', 'Menlo', monospace;
    --sans: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
  #app{display:flex;height:100%;}

  /* ---------- left toolbar ---------- */
  #toolbar{
    width:200px; flex:0 0 200px; background:var(--bg-panel);
    border-right:1px solid var(--grid-line); padding:14px 12px; overflow-y:auto;
  }
  #toolbar h1{
    font-size:13px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--amber); margin:0 0 4px; font-weight:700;
  }
  #toolbar .sub{font-size:11px;color:var(--text-dim);margin-bottom:16px;}
  .tool-btn{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:transparent; border:1px solid transparent; color:var(--text);
    padding:8px 10px; margin-bottom:4px; border-radius:4px; cursor:pointer;
    font-size:13px; font-family:var(--sans);
  }
  .tool-btn:hover{background:rgba(255,255,255,.04);}
  .tool-btn.active{background:rgba(46,166,161,.15); border-color:var(--teal); color:#eafffb;}
  .tool-btn .cost{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .tool-swatch{
    width:22px;height:22px;border-radius:6px;flex:0 0 auto;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .tool-swatch .badge{position:absolute;inset:2px;border-radius:4px;background:rgba(6,11,17,.55);}
  .tool-icon{
    width:14px;height:14px;position:relative;z-index:1;
    fill:none;stroke:#eef4f8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  }
  .section-label{
    font-size:10px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--text-dim); margin:16px 0 6px;
  }
  #toolbar select{
    width:100%; background:var(--bg); color:var(--text); border:1px solid var(--grid-line);
    padding:6px; border-radius:4px; font-size:12px; margin-bottom:4px;
  }
  /* ---------- center stage ---------- */
  #stage{flex:1; display:flex; flex-direction:column; min-width:0;}
  #hud{
    height:44px; flex:0 0 44px; background:var(--bg-panel);
    border-bottom:1px solid var(--grid-line); display:flex; align-items:center;
    padding:0 16px; gap:24px;
  }
  #treasury{font-family:var(--mono); font-size:18px; color:var(--amber); font-weight:700;}
  #treasury.negative{color:var(--danger);}
  #tickInfo{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  #hint{font-size:12px;color:var(--text-dim); margin-left:auto;}
  #canvasWrap{flex:1; overflow:auto; background:var(--bg); display:flex; align-items:center; justify-content:center;}
  canvas{background:var(--ground); image-rendering:pixelated; cursor:crosshair;}

  /* ---------- right panel ---------- */
  #sidepanel{
    width:260px; flex:0 0 260px; background:var(--bg-panel);
    border-left:1px solid var(--grid-line); padding:14px 12px; overflow-y:auto;
  }
  #sidepanel h2{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--teal); margin:0 0 10px;}
  #selectionInfo{font-size:12px; line-height:1.6; color:var(--text-dim);}
  #selectionInfo b{color:var(--text);}
  .order-row{
    display:flex; align-items:center; gap:6px; background:var(--bg);
    border:1px solid var(--grid-line); border-radius:4px; padding:6px 8px; margin-bottom:5px; font-size:12px;
  }
  .order-row .idx{color:var(--text-dim); font-family:var(--mono); width:14px;}
  .order-row .act{color:var(--amber); font-family:var(--mono); font-size:11px;}
  .order-row .rm{margin-left:auto; cursor:pointer; color:var(--danger); font-weight:700;}
  .btn{
    background:var(--teal); color:#032523; border:none; border-radius:4px;
    padding:7px 10px; font-size:12px; cursor:pointer; font-weight:600; width:100%;
    margin-top:6px;
  }
  .btn.secondary{background:transparent; border:1px solid var(--road-edge); color:var(--text);}
  .btn.danger{background:var(--danger); color:#2a0d0a;}
  .fill-bar{height:6px;border-radius:3px;background:var(--grid-line);overflow:hidden;margin:4px 0 8px;}
  .fill-bar > div{height:100%; background:var(--teal);}

  #log{
    position:fixed; left:212px; bottom:0; right:270px; max-height:120px; overflow-y:auto;
    background:rgba(9,16,24,.92); border-top:1px solid var(--grid-line); font-family:var(--mono);
    font-size:11px; padding:6px 10px; pointer-events:none;
  }
  #log div{color:var(--text-dim); padding:1px 0;}
  #log div.money{color:var(--amber);}
  #log div.warn{color:var(--danger);}
</style>
</head>
<body>

<div id="app">

  <div id="toolbar">
    <h1>Logistics</h1>
    <div class="sub">Phase 1 — ground roads &amp; trucks</div>

    <div class="section-label">Tools</div>
    <button class="tool-btn active" data-tool="select"><span class="tool-swatch" style="background:var(--road-edge)"><span class="badge"></span><svg class="tool-icon" viewBox="0 0 24 24"><use href="#icon-select"/></svg></span>Select / Inspect</button>
    <button class="tool-btn" data-tool="demolish"><span class="tool-swatch" style="background:var(--danger)"><span class="badge"></span><svg class="tool-icon" viewBox="0 0 24 24"><use href="#icon-demolish"/></svg></span>Demolish</button>

    <div class="section-label">Industry</div>
    <!-- One tool-btn per BUILDING_DEFS entry with a `recipe` field is
         generated here at load time by ui.js's generateProductionButtons()
         (§ Dynamic toolbar) — Town/Station/Depot/Train Yard have no recipe
         and stay hand-written below, since they need their own extra UI
         (resource dropdown, facing, orientation) that isn't purely
         data-driven yet. This is what makes a content-pack addon's own new

    <div id="productionButtons"></div>
    <button class="tool-btn" data-tool="town"><span class="tool-swatch" style="background:#3a6ea5"><span class="badge"></span><svg class="tool-icon" viewBox="0 0 24 24"><use href="#icon-town"/></svg></span>Build Town<span class="cost" id="townCost">$100</span></button>
    <select id="tierSelect">
      <option value="small">Small — +$0, cap 20</option>
      <option value="large">Large — +$100, cap 50</option>
    </select>
    <select id="townResourceSelect">
      <!-- One "Town accepts: X" option per RESOURCES entry is injected
           here at load time by ui.js (§ Dynamic toolbar) — a content-pack
           addon's own new resource (e.g. Coal) needs to be choosable here,
           or nothing could ever be built to consume it. -->
    </select>

    <div class="section-label">Terrain</div>
    <button class="tool-btn" data-tool="raiseterrain"><span class="tool-swatch" style="background:#c9a15a"><span class="badge"></span><svg class="tool-icon" viewBox="0 0 24 24"><use href="#icon-raiseterrain"/></svg></span>Raise Terrain<span class="cost" id="raiseTerrainCost">$30</span></button>

      <option value="6">× 6 wagons</option>

    <button class="tool-btn" id="loadGameBtn"><span class="tool-swatch" style="background:var(--amber)"><span class="badge"></span><svg class="tool-icon" viewBox="0 0 24 24"><use href="#icon-load"/></svg></span>Load Game</button>

  </div>

  <div id="stage">
    <div id="hud">
      <div id="treasury">$0</div>
      <div id="tickInfo">tick 0</div>
      <div id="hint">Click a tool, then click the grid.</div>

    <div id="canvasWrap">
      <canvas id="c" width="1440" height="720"></canvas>
    </div>
  </div>

  <div id="sidepanel">
    <h2>Inspector</h2>
    <div id="selectionInfo">Nothing selected. Click a building or a truck.</div>

</div>

<!--
  CONTENT PACKS — the game's resources/recipes/buildings/vehicles/rail/
  engines/wagons, as JSON blocks instead of inline JS objects (§9/§13's
  "new resource = new JSON file, no code change" claim). This is a
  deliberate middle ground, not real data/*.json files: those need either
  a bundler or fetch() calls, and fetch() fails under file:// without a
  local server — the exact reason this project stays one self-contained
  HTML file. This gets almost all of the practical benefit (a modder edits
  one clearly-delineated JSON block, not JS source) without the
  CORS/bundler problem. A real data/ directory becomes a later, purely
  additive step if/when a bundler is adopted for other reasons.

  There can be any number of these — every <script type="application/json"
  class="content-pack"> block on the page is parsed and merged, in document
  order, into the one pack object validateContentPack/initContentPack
  actually consume (see mergeContentPacks in loader.js). This is the real
  version of §9's "A ContentPack loader merges base-game data with any
  additional packs" — a pack after the base one only has to include the
  section(s)/id(s) it actually adds; reusing an id already used by an
  earlier pack replaces that entry entirely (an override), the seam a mod
  seeking to reskin or rebalance one specific building/vehicle would use.
  The two shipped here demonstrate the "add" side of that: the base pack is
  the original single-pack game unchanged, and content-pack-coal is a small
  second pack adding a wholly new resource/recipe/building/vehicle/wagon
  with no edits to the base pack at all (see test/test-content-pack.js for
  both "add" and "override" merge behavior exercised directly, including
  cross-pack references like an addon recipe naming a base-pack resource).

  Parsed once at startup into the RESOURCES/RECIPES/BUILDING_DEFS/
  VEHICLE_DEFS/RAIL_DEFS/ENGINE_DEFS/WAGON_DEFS bindings the rest of the
  script already uses (see validateContentPack / the parsing block right
  after this) — zero changes to any system, command, or render code, since
  they only ever reference the parsed result, never these blocks directly.

  Trains are not a single vehicle def the way trucks are: a train is
  assembled at a Train Yard from one engine (defines physics — speed,
  mass, engine/brake force) plus N identical wagons (defines the load —
  capacity and which single resource it carries, exactly like a truck's
  fixed resource). See the Consist component / getTrainStats in the main
  script for how engines+wagons combine into one vehicle's stats.

  Coal's building (Colliery) and vehicles (Coal Hauler truck, Coal Hopper
  wagon) are reachable through the real toolbar UI, not just the command
  API — see ui.js's generateProductionButtons()/generateVehicleButtons()
  (§ Dynamic toolbar), which builds a button per BUILDING_DEFS entry with
  a recipe / per VEHICLE_DEFS entry, so any production building or vehicle
  a content pack adds shows up with zero index.html changes.
-->

    "station": { "buildCost": 60,  "tiers": { "small": { "cap": 0, "add": 0 }, "large": { "cap": 0, "add": 0 } }, "color": "#c9a227", "label": "Station", "footprint": { "w": 1, "h": 1 }, "transferRate": 4 },

  },
  "vehicles": {

  },
  "rail": {
